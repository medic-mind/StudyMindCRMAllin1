name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Policy matrix drift check
        run: pnpm policy:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Auth.js v5 (ADR 0010); placeholder secret for build only.
          AUTH_SECRET: ci-build-placeholder
