name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push supersedes an in-flight run of the same ref — no point
# finishing a verification of code that is no longer the tip.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version is pinned via the `packageManager` field in package.json
        # (pnpm@9.12.0). action-setup v4 errors if a `version` is also given
        # here, so we let it read the single source of truth.

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Turborepo's local cache persists task outputs between runs, so an
      # unchanged package's typecheck/lint/test is a cache hit instead of a
      # re-run. Keyed per-commit with a restore fallback to the most recent
      # cache on the same lockfile.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # One turbo invocation runs the whole graph in parallel with shared
      # caching, instead of four serial full-tree passes.
      - name: Verify (typecheck + lint + test + build)
        # Turbo's local cache lives in .turbo/cache by default (restored above).
        run: pnpm turbo run typecheck lint test build
        env:
          # Auth.js v5 (ADR 0010); placeholder secret for build only.
          AUTH_SECRET: ci-build-placeholder

      - name: Policy matrix drift check
        run: pnpm policy:check
